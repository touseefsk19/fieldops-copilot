name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    # A throwaway SQL Server just for this run: the API applies migrations when tests start it
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.CI_SQL_PASSWORD }}
        ports:
          - 1433:1433

    env:
      # Same key the app reads locally from user-secrets: ConnectionStrings:FieldOps
      ConnectionStrings__FieldOps: "Server=localhost,1433;Database=FieldOps;User Id=sa;Password=${{ secrets.CI_SQL_PASSWORD }};TrustServerCertificate=True"

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Wait for SQL Server to accept logins
        env:
          SA_PASSWORD: ${{ secrets.CI_SQL_PASSWORD }}
        run: |
          for i in $(seq 1 30); do
            if docker exec ${{ job.services.sql.id }} /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server is ready"; exit 0
            fi
            echo "waiting ($i)..."; sleep 3
          done
          echo "SQL Server did not start"; exit 1

      - name: Build and test
        run: dotnet test tests/FieldOps.Api.Tests

  docker:
    runs-on: ubuntu-latest
    needs: build-test   # only build the image when the tests pass

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Build the API image
        run: docker build -t fieldops-api:${{ github.sha }} .