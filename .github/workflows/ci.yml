name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    # A throwaway SQL Server just for this run: the API applies migrations when tests start it
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.CI_SQL_PASSWORD }}
        ports:
          - 1433:1433

    env:
      # Same key the app reads locally from user-secrets: ConnectionStrings:FieldOps
      ConnectionStrings__FieldOps: "Server=localhost,1433;Database=FieldOps;User Id=sa;Password=${{ secrets.CI_SQL_PASSWORD }};TrustServerCertificate=True"

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Wait for SQL Server to accept logins
        env:
          SA_PASSWORD: ${{ secrets.CI_SQL_PASSWORD }}
        run: |
          for i in $(seq 1 30); do
            if docker exec ${{ job.services.sql.id }} /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server is ready"; exit 0
            fi
            echo "waiting ($i)..."; sleep 3
          done
          echo "SQL Server did not start"; exit 1

      - name: Manual ingestion checks (Python)
        run: python3 -m unittest discover -s tools/ingest -v

      - name: Build and test
        run: dotnet test tests/FieldOps.Api.Tests

  docker:
    runs-on: ubuntu-latest
    needs: build-test   # only build the image when the tests pass
    permissions:
      contents: read
      packages: write   # lets this job push to ghcr.io with the built-in token

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Build the API image
        run: docker build -t ghcr.io/touseefsk19/fieldops-api:${{ github.sha }} -t ghcr.io/touseefsk19/fieldops-api:latest .

      - name: Push to GitHub Container Registry (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push --all-tags ghcr.io/touseefsk19/fieldops-api


  deploy:
    runs-on: ubuntu-latest
    needs: docker   # only after the image for this commit is in ghcr.io
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write   # lets GitHub issue the OIDC token that Azure trusts
      contents: read

    steps:
      - name: Sign in to Azure with OIDC (no stored secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy this commit's image to Container Apps
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update -g rg-fieldops -n ca-fieldops-api \
            --image ghcr.io/touseefsk19/fieldops-api:${{ github.sha }} \
            --query "properties.latestRevisionName" -o tsv

      - name: Smoke test (/health must answer 200)
        run: |
          FQDN=$(az containerapp show -g rg-fieldops -n ca-fieldops-api --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://$FQDN/health" || true)
            if [ "$code" = "200" ]; then echo "Healthy: https://$FQDN"; exit 0; fi
            echo "waiting ($i): $code"; sleep 10
          done
          echo "Smoke test failed"; exit 1
